name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use an Ubuntu runner

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v2  # Checkout the code from your repo

      - name: Set up Node.js
        uses: actions/setup-node@v2  # Set up Node.js for the workflow
        with:
          node-version: '16'  # Use the version of Node.js your project requires

      - name: Install dependencies
        run: npm install  # Install dependencies

      - name: Build the app
        run: npm run build  # Build the production-ready app

      - name: Deploy to GitHub Pages
        run: npm run deploy  # Run the deploy command (you should have `gh-pages` setup)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub token for authentication
